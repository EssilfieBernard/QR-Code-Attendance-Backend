name: Deploy to ECR

on:
  push:
    branches:
      - testing

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Build with Maven
        run: mvn clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          registry-type: private

      - name: Build, tag, and push image to Amazon ECR
        run: |
          echo "Building Docker image..."
          docker build -t 388832152997.dkr.ecr.us-east-1.amazonaws.com/test-qr:latest .
          echo "Pushing Docker image to Amazon ECR..."
          docker push 388832152997.dkr.ecr.us-east-1.amazonaws.com/test-qr:latest

          echo "Success! Image pushed to ECR:"
          echo "  - Latest: 388832152997.dkr.ecr.us-east-1.amazonaws.com/test-qr:latest"
          
